webdriver {
  driver = chrome
  timeouts.implicitlywait = 10000
}

serenity {
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
  report.annotations = "STEP, ISSUE, TITLE"
}

chrome {
  switches = """--start-maximized;--remote-allow-origins=*;--disable-notifications;--disable-extensions;--no-sandbox;--disable-dev-shm-usage"""
}

environments {
  default {
    webdriver.base.url = "https://bomberogestion.vercel.app"
  }
}